spring.application.name=academy-portal
server.port=${PORT:8080}

# ---------------------------------------------------------------- MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:academy_portal}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:root}
# No password is committed: export MYSQL_PASSWORD (see README) before starting the app.
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# Schema and demo data are plain SQL files, executed on every boot.
# Both scripts are idempotent (CREATE TABLE IF NOT EXISTS / INSERT IGNORE).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.continue-on-error=false

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ---------------------------------------------------------------- web
spring.web.resources.cache.period=0
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=true
# Profile pictures: the service rejects anything over 2 MB on its own as well.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ---------------------------------------------------------------- demo accounts
# Created on first boot by UserSeeder. Change these before deploying anywhere real.
portal.seed.users.enabled=true
portal.seed.admin.username=admin
portal.seed.admin.password=admin123
# The old single demo logins; existing accounts under these names are moved to the email.
portal.seed.student.username=student
portal.seed.teacher.username=teacher
# Students and teachers sign in with their academy email and this shared password until they change it.
portal.default-password=${ACADEMY_DEFAULT_PASSWORD:PASSWORD}

# ---------------------------------------------------------------- certificates
# The heading printed on every graduation certificate.
portal.certificate.academy-name=${CERTIFICATE_ACADEMY_NAME:Academy Portal}

logging.level.org.springframework.jdbc.datasource.init=INFO
logging.level.com.academy.portal=INFO
